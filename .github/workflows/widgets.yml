# Génère presence.json, feuille-verte.json et eliasse.json et les publie sur la branche « donnees ».
#
# Pourquoi une boucle ? Les tâches planifiées de GitHub ne partent pas à l'heure (retards de
# 5 à 15 min, passages parfois sautés). On déclenche donc un passage toutes les 30 min ; pendant
# une séance, ce passage reste actif ~28-30 min et régénère les données lui-même toutes les 5 min.
# Hors séance, il fait un seul passage rapide (le script ne travaille qu'une fois par heure).
#
# Les widgets lisent ensuite :
#   https://raw.githubusercontent.com/<compte>/<depot>/donnees/presence.json   (idem pour les 2 autres)
name: Widgets séance

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}          # bouton « Run workflow » pour forcer un passage

concurrency:
  group: widgets-seance
  cancel-in-progress: false      # un passage en attente démarre dès que le précédent se termine

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les fichiers du passage précédent (cache)
        run: |
          mkdir -p public
          if git fetch -q --depth=1 origin donnees; then
            git archive FETCH_HEAD | tar -x -C public
          fi

      - name: Générer et publier (toutes les 5 min tant qu'une séance est en cours)
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
          DEPOT: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          publier() {
            # un seul commit, écrasé à chaque fois : la branche reste légère
            rm -rf /tmp/pub && cp -r public /tmp/pub && cd /tmp/pub
            git init -q -b donnees
            git config user.name  "widgets-seance"
            git config user.email "widgets-seance@users.noreply.github.com"
            git add -A
            git commit -q -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q -f "$DEPOT" donnees
            cd - > /dev/null
          }
          debut=$(date +%s)
          tour=0
          while :; do
            avant=$(cat public/*.json 2>/dev/null | sha1sum)
            rm -f /tmp/sortie && GITHUB_OUTPUT=/tmp/sortie node serveur/build.mjs --out public $FORCE || true
            FORCE=""
            apres=$(cat public/*.json 2>/dev/null | sha1sum)
            if [ "$avant" != "$apres" ]; then publier; echo "Publié."; else echo "Aucun changement."; fi
            tour=$((tour + 1))
            # on continue seulement si une séance est en cours et qu'il reste du temps avant le passage suivant
            grep -q "actif=1" /tmp/sortie 2>/dev/null || break
            ecoule=$(( $(date +%s) - debut ))
            # jusqu'à ~28 min : le passage suivant (toutes les 30 min) prend le relais sans trou
            [ $ecoule -lt $((27 * 60)) ] || break
            sleep $(( 300 - ( $(date +%s) - debut ) % 300 ))
          done
          echo "$tour passage(s) effectué(s)."
