# Génère presence.json, feuille-verte.json et eliasse.json et les publie sur la branche « donnees ».
# Le planificateur appelle le script toutes les 5 minutes ; hors séance, le script ne travaille
# qu'une fois par heure (il sort aussitôt les autres fois).
#
# Les widgets lisent ensuite :
#   https://raw.githubusercontent.com/<compte>/<depot>/donnees/presence.json   (idem pour les 2 autres)
#
# Attention : GitHub ne garantit pas l'heure exacte des tâches planifiées (retards de 5 à 15 min
# possibles aux heures chargées). Pour une cadence stricte, utiliser le cron de Perchoir Radar (voir README).
name: Widgets séance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}          # bouton « Run workflow » pour forcer un passage

concurrency:
  group: widgets-seance
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les fichiers du passage précédent (cache)
        run: |
          mkdir -p public
          if git fetch -q --depth=1 origin donnees; then
            git archive FETCH_HEAD | tar -x -C public
          fi
          cat public/*.json 2>/dev/null | sha1sum > /tmp/avant.sha

      - name: Générer les JSON
        run: node serveur/build.mjs --out public ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Publier sur la branche « donnees » (un seul commit, écrasé à chaque fois)
        run: |
          cat public/*.json 2>/dev/null | sha1sum > /tmp/apres.sha
          if cmp -s /tmp/avant.sha /tmp/apres.sha; then echo "Aucun changement."; exit 0; fi
          cd public
          git init -q -b donnees
          git config user.name  "widgets-seance"
          git config user.email "widgets-seance@users.noreply.github.com"
          git add -A
          git commit -q -m "Données du $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" donnees
